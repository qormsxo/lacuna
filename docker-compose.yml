services:
  postgres:
    image: postgres:16-alpine
    container_name: lacuna-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lacuna}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lacuna}
      POSTGRES_DB: ${POSTGRES_DB:-lacuna}
    volumes:
      - lacuna_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lacuna} -d ${POSTGRES_DB:-lacuna}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lacuna_postgres_data:
